name: Phase 1 Session Runtime Codemod

on:
  push:
    branches:
      - phase1/runtime-session-midi-boundaries

permissions:
  contents: write

jobs:
  rewrite-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase1/runtime-session-midi-boundaries
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic session runtime codemod
        run: node scripts/apply-phase1-session-runtime.mjs

      - name: Commit rewritten app source
        run: |
          if git diff --quiet -- src/app.js; then
            echo "No app rewrite required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Phase 1: wire session runtime controller"
          git push origin HEAD:phase1/runtime-session-midi-boundaries
