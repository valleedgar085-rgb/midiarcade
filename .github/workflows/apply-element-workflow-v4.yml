name: Apply Element Workflow V4

on:
  push:
    branches:
      - phase4/shape-director
    paths:
      - scripts/apply-element-workflow-v4.mjs
      - .github/workflows/apply-element-workflow-v4.yml

permissions:
  contents: write

jobs:
  guard-element-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/shape-director
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair temporary Element harness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-element-workflow-v4.mjs')
          text = path.read_text()
          old = '}, { seed: `element-shape-${provenance}` });'
          new = '}, { seed: "element-shape-" + provenance });'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              "'    renderSongVariationTray();\\n    renderCreativeThread();'",
              "'  renderSongVariationTray();\\n  renderCreativeThread();'",
              1,
          )
          text = text.replace(
              "'    renderActiveElementIdentity();\\n    renderSongVariationTray();\\n    renderCreativeThread();'",
              "'  renderActiveElementIdentity();\\n  renderSongVariationTray();\\n  renderCreativeThread();'",
              1,
          )
          start_marker = 'const trayBlock = `'
          end_marker = '\n\nexport function selectSongVariation`;'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Element tray template repair target not found')
          body_start = start + len(start_marker)
          body = text[body_start:end]
          body = body.replace('${', r'\${')
          text = text[:body_start] + body + text[end:]
          path.write_text(text)
          PY
      - name: Apply first-class Elements patch
        run: node scripts/apply-element-workflow-v4.mjs
      - name: Tighten Element test fixtures and preserve HTML budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow_test = Path('tests/element-workflow-v4.test.mjs')
          text = workflow_test.read_text()
          old = 'assert.doesNotMatch(html, /id="songVariationTray"[^>]*hidden/);'
          new = 'assert.doesNotMatch(html, /<section[^>]*id="songVariationTray"[^>]*\\shidden(?:\\s|>)/);'
          if old not in text:
              raise SystemExit('Element visibility assertion target not found')
          workflow_test.write_text(text.replace(old, new, 1))

          engine_test = Path('tests/shape-director-engine.test.mjs')
          text = engine_test.read_text()
          old = '''    const transaction = createShapeCandidate(source, {
              selection: { target: "track", sectionId: "verse", trackId: "melody" },
              size: "reshape",
              direction: "catchier",
            }, { seed: "element-shape-" + provenance });'''
          new = '''    const intent = createShapeIntent({
              selection: { target: "track", sectionId: "verse", trackId: "melody" },
              size: "reshape",
              direction: "catchier",
            });
            const transaction = createShapeCandidate(source, intent, { seed: "element-shape-" + provenance });'''
          if old not in text:
              raise SystemExit('Element Shape intent fixture target not found')
          engine_test.write_text(text.replace(old, new, 1))

          html_path = Path('index.html')
          html = html_path.read_text()
          start = html.find('<section class="shape-director-panel"')
          if start < 0:
              raise SystemExit('Shape Director panel not found for safe whitespace compaction')
          end = html.find('</section>', start)
          if end < 0:
              raise SystemExit('Shape Director panel closing tag not found')
          end += len('</section>')
          panel = html[start:end]
          compact = re.sub(r'>\s+<', '><', panel)
          html_path.write_text(html[:start] + compact + html[end:])
          print(f'Compacted Shape Director markup by {len(panel) - len(compact)} bytes')
          PY
      - name: Verify focused Element and Shape contracts
        run: node --test tests/element-workflow-v4.test.mjs tests/element-button-v3.test.mjs tests/elemental-lineage.test.mjs tests/shape-director-engine.test.mjs tests/shape-director-ui-contract.test.mjs
      - name: Verify complete quality gate
        run: |
          npm run quality
          npm run quality:music
      - name: Commit verified Elements workflow
        run: |
          if git diff --quiet -- index.html src/app.js src/core/shape-director-engine.js src/ui/element-button-v3.js src/ui/shape-director.css tests/shape-director-engine.test.mjs tests/element-workflow-v4.test.mjs; then
            echo "No Element workflow changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/app.js src/core/shape-director-engine.js src/ui/element-button-v3.js src/ui/shape-director.css tests/shape-director-engine.test.mjs tests/element-workflow-v4.test.mjs
          git commit -m "Make Elements first-class across Create and Shape"
          git push origin HEAD:phase4/shape-director
