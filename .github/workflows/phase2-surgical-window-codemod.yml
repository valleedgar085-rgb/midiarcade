name: Phase 2 Surgical Window Codemod

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search

permissions:
  contents: write

jobs:
  rewrite-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply surgical repair patch
        run: node scripts/apply-phase2-surgical-window-repair.mjs
      - name: Commit engine patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/music-engine.js
          git commit -m "Phase 2: add surgical window regeneration"
          git push origin HEAD:phase2/producer-brain-weakness-aware-search
