name: Apply Phase 3 Review Cleanup v4

on:
  push:
    branches:
      - phase-3-groove-intelligence
    paths:
      - .github/workflows/phase3-review-cleanup-v4.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-groove-intelligence
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply review cleanup
        run: python scripts/phase3-review-cleanup.py
      - name: Verify focused contracts
        run: |
          node --check src/music-engine.js
          node --test tests/groove-intelligence.test.mjs
          node --test --test-name-pattern="phase 20|phase 40|phase 39|targeted Similar generation composes" tests/music-engine.test.mjs
          node --test --test-name-pattern="dense maximum-length output" tests/engine-adversarial.test.mjs
      - name: Recheck strict Phase 3 calibration
        run: |
          node --input-type=module <<'NODE'
          import { runGenerationBenchmark } from './src/generation-benchmark.js';
          const report = runGenerationBenchmark({ seeds: ['calibration-a', 'calibration-b', 'calibration-c'], bars: 16 });
          const groove = report.groupAverages.groove;
          const drumVariety = report.dimensionAverages.drumVariety;
          console.log(`Review-cleanup calibration: groove=${groove}, drumVariety=${drumVariety}`);
          if (groove < 85) throw new Error(`Groove regressed below target: ${groove}`);
          if (drumVariety < 82) throw new Error(`Drum variety regressed below target: ${drumVariety}`);
          NODE
      - name: Commit cleanup and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase3-review-cleanup.yml .github/workflows/phase3-review-cleanup-v2.yml .github/workflows/phase3-review-cleanup-v3.yml .github/workflows/phase3-review-cleanup-v4.yml scripts/phase3-review-cleanup.py
          git add src/music-engine.js tests/groove-intelligence.test.mjs
          git commit -m "Address Phase 3 review contracts"
          git push origin HEAD:phase-3-groove-intelligence
