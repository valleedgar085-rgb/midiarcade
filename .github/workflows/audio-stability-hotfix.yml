name: Audio Playback Stability Hotfix

on:
  push:
    branches:
      - phase-audio-playback-stability
    paths:
      - scripts/apply-audio-stability-hotfix.mjs
      - .github/workflows/audio-stability-hotfix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply preview stability patch
        run: node scripts/apply-audio-stability-hotfix.mjs
      - name: Focused audio stability and next-beat tests
        run: node --test tests/preview-performance.test.mjs tests/app-smoke.test.mjs
      - name: Full production quality
        run: npm run quality
      - name: Music quality regression gate
        run: npm run quality:music
      - name: Commit permanent hotfix only
        run: |
          rm scripts/apply-audio-stability-hotfix.mjs
          rm .github/workflows/audio-stability-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/core/preview-performance.js tests/preview-performance.test.mjs tests/app-smoke.test.mjs scripts/apply-audio-stability-hotfix.mjs .github/workflows/audio-stability-hotfix.yml
          git commit -m "Stabilize Android preview audio scheduling"
          git push origin HEAD:phase-audio-playback-stability
