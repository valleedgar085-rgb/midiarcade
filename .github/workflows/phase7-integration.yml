name: Phase 7 Runtime Integration

on:
  push:
    branches:
      - phase-7-audio-runtime-cleanup
    paths:
      - "src/core/preview-performance.js"
      - "src/core/preview-audio.js"
      - "tests/preview-performance.test.mjs"
      - "tests/phase7-audio-runtime.test.mjs"
      - "scripts/apply-phase7-runtime-cleanup.mjs"
      - ".gitignore"
      - ".github/workflows/phase7-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Phase 7
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and apply runtime patch
        run: |
          node --check scripts/apply-phase7-runtime-cleanup.mjs
          node scripts/apply-phase7-runtime-cleanup.mjs
          git rm -r --ignore-unmatch tmp/edge-cdp-profile
          test ! -e tmp/edge-cdp-profile

      - name: Focused audio and lifecycle contracts
        run: node --test tests/preview-performance.test.mjs tests/phase7-audio-runtime.test.mjs tests/app-smoke.test.mjs

      - name: Full quality gate
        run: npm run quality

      - name: Music quality lab
        run: npm run quality:music

      - name: Commit permanent Phase 7 integration
        run: |
          rm scripts/apply-phase7-runtime-cleanup.mjs
          rm .github/workflows/phase7-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Phase 7: harden Android preview runtime and cleanup"
            git push origin HEAD:phase-7-audio-runtime-cleanup
          fi
