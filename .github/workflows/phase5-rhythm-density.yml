name: Phase 5 Rhythm Density Diagnostic

on:
  pull_request:
    paths:
      - "src/music-engine.js"
      - "src/core/**"
      - "scripts/benchmark-rhythm-density.mjs"
      - ".github/workflows/phase5-rhythm-density.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run rhythm-density diagnostic
        run: node scripts/benchmark-rhythm-density.mjs /tmp/phase5-rhythm-density.json
      - name: Upload rhythm-density report
        uses: actions/upload-artifact@v4
        with:
          name: phase5-rhythm-density
          path: /tmp/phase5-rhythm-density.json
          if-no-files-found: error
          retention-days: 30
