name: Patch Phase 9D Return Payoff

on:
  push:
    branches:
      - phase9d/return-development-genome

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9d/return-development-genome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Phase 9D return-payoff patch
        run: node scripts/patch-phase9d-return-payoff.mjs
      - name: Verify focused return-development contracts
        run: node --test tests/return-development.test.mjs tests/creative-genome-motif-steering.test.mjs
      - name: Verify full repository quality gate
        run: npm run quality
      - name: Commit validated Phase 9D patch and remove patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982c+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-phase9d-return-payoff.yml scripts/patch-phase9d-return-payoff.mjs
          git add src/core/return-development.js src/core/output-quality-postprocess.js tests/return-development.test.mjs
          git commit -m "Phase 9D: coordinate return payoff with native spotlight"
          git push origin HEAD:phase9d/return-development-genome
