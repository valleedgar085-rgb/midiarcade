name: Phase 2 Repair Effectiveness Calibration

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search
    paths:
      - .github/workflows/phase2-repair-calibration.yml
      - src/repair-effectiveness-benchmark.js
      - scripts/benchmark-repair-effectiveness.mjs
      - src/music-engine.js
      - package.json

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Measure repair effectiveness
        run: npm run benchmark:repairs -- --seeds 2 --bars 8
