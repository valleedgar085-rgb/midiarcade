name: Reconcile Phase 3 Contracts

on:
  push:
    branches:
      - phase-3-groove-intelligence
    paths:
      - .github/workflows/phase3-contract-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-3-groove-intelligence
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Reconcile groove memory with existing contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/music-engine.js';
          let source = fs.readFileSync(path, 'utf8');
          const replaceOne = (before, after, label) => {
            if (!source.includes(before)) throw new Error(`${label} anchor not found`);
            source = source.replace(before, after);
          };

          replaceOne(
            'function reinforceGrooveMemory(source, config, structure, songBlueprint) {',
            'function reinforceGrooveMemory(source, config, structure, songBlueprint, grooveConductor) {',
            'groove-memory signature',
          );
          replaceOne(
            '  const barBeats = beatsPerBar(config);\n  const sectionForBar = (bar) => structure.find((section) => (',
            '  const barBeats = beatsPerBar(config);\n  const phraseBars = clamp(Math.round(finite(grooveConductor?.phraseBars, 2)), 2, 4);\n  const sectionForBar = (bar) => structure.find((section) => (',
            'phrase cycle',
          );
          replaceOne(
            '    if (bar === section.startBar || transitionBars.has(bar)) return true;\n    return barNotes.some((note) => (',
            '    if (bar === section.startBar || transitionBars.has(bar)) return true;\n    if (mod(bar - section.startBar, phraseBars) === 0) return true;\n    return barNotes.some((note) => (',
            'phrase-start protection',
          );
          replaceOne(
            '    const targetRole = bar - targetSection.startBar;',
            '    const targetRole = mod(bar - targetSection.startBar, phraseBars);',
            'target phrase role',
          );
          replaceOne(
            '      const referenceRole = referenceBar - referenceSection.startBar;',
            '      const referenceRole = mod(referenceBar - referenceSection.startBar, phraseBars);',
            'reference phrase role',
          );
          replaceOne(
            '    const referenceNotes = notesForBar(referenceBar);\n    const targetNotes = notesForBar(bar);\n    if (!referenceNotes.length || !targetNotes.length) continue;',
            '    const referenceNotes = notesForBar(referenceBar);\n    const targetNotes = notesForBar(bar);\n    if (!referenceNotes.length || !targetNotes.length) continue;\n    const targetConnectionNote = targetNotes.find((note) => note.connectionId) ?? targetNotes[0];',
            'target metadata capture',
          );
          replaceOne(
            '        connectionId: _connectionId,\n        transitionFeature: _transitionFeature,',
            '        connectionId: _connectionId,\n        connectionRole: _connectionRole,\n        sectionPatternId: _sectionPatternId,\n        phraseRole: _phraseRole,\n        transitionFeature: _transitionFeature,',
            'source metadata stripping',
          );
          replaceOne(
            '        velocity: clamp(Math.round(finite(note.velocity, 80) * velocityRatio), 1, 127),\n        sectionId: targetSection.id,',
            '        velocity: clamp(Math.round(finite(note.velocity, 80) * velocityRatio), 1, 120),\n        sectionId: targetSection.id,\n        connectionId: targetConnectionNote?.connectionId ?? `interlock:${targetSection.id}`,\n        ...(targetConnectionNote?.connectionRole ? { connectionRole: targetConnectionNote.connectionRole } : {}),\n        ...(targetConnectionNote?.sectionPatternId ? { sectionPatternId: targetConnectionNote.sectionPatternId } : {}),\n        ...(targetConnectionNote?.phraseRole ? { phraseRole: targetConnectionNote.phraseRole } : {}),',
            'target metadata restore and velocity ceiling',
          );
          replaceOne(
            'function applyFinalGrooveMemory(tracks, config, structure, songBlueprint) {\n  return tracks.map((track) => track.id === "drums"\n    ? { ...track, notes: reinforceGrooveMemory(track.notes, config, structure, songBlueprint) }',
            'function applyFinalGrooveMemory(tracks, config, structure, songBlueprint, grooveConductor) {\n  return tracks.map((track) => track.id === "drums"\n    ? { ...track, notes: reinforceGrooveMemory(track.notes, config, structure, songBlueprint, grooveConductor) }',
            'groove-memory wrapper',
          );
          replaceOne(
            '  const finalGrooveMemoryTracks = applyFinalGrooveMemory(\n    finalProducerIntentAudit.tracks,\n    config,\n    structure,\n    songBlueprint,\n  );',
            '  const finalGrooveMemoryTracks = targetTrack\n    ? finalProducerIntentAudit.tracks\n    : applyFinalGrooveMemory(\n      finalProducerIntentAudit.tracks,\n      config,\n      structure,\n      songBlueprint,\n      grooveConductor,\n    );',
            'targeted-generation guard',
          );

          fs.writeFileSync(path, source);
          console.log('Reconciled Phase 3 groove memory with velocity, interlock, phrase-grammar, and targeted-reroll contracts.');
          NODE
      - name: Verify four caught regressions and Phase 3 contracts
        run: |
          node --check src/music-engine.js
          node --test --test-name-pattern="dense maximum-length output|phase 39 connects|drum grammar stays coherent|targeted Similar generation composes" tests/engine-adversarial.test.mjs tests/music-engine.test.mjs
          node --test tests/groove-intelligence.test.mjs
      - name: Recheck strict music calibration
        run: |
          node --input-type=module <<'NODE'
          import { runGenerationBenchmark } from './src/generation-benchmark.js';
          const report = runGenerationBenchmark({ seeds: ['calibration-a', 'calibration-b', 'calibration-c'], bars: 16 });
          const groove = report.groupAverages.groove;
          const drumVariety = report.dimensionAverages.drumVariety;
          console.log(`Phase 3 reconciled calibration: groove=${groove}, drumVariety=${drumVariety}, technical=${report.technicalAverage ?? report.technical}`);
          if (groove < 85) throw new Error(`Groove regressed below target: ${groove}`);
          if (drumVariety < 82) throw new Error(`Drum variety regressed below target: ${drumVariety}`);
          NODE
      - name: Commit reconciled engine and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-contract-reconcile.yml
          git add src/music-engine.js
          git commit -m "Reconcile groove memory with engine contracts"
          git push origin HEAD:phase-3-groove-intelligence
