<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080b"/>
      <stop offset="100%" stop-color="#131320"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d6fff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="8"/>
  
  <!-- 2x2 Arcade Grid Emblem -->
  <g filter="url(#glow)">
    <!-- Top-Left: Rounded Square (Purple) -->
    <rect x="116" y="116" width="128" height="128" rx="24" fill="url(#purpleGrad)"/>
    
    <!-- Top-Right: Circle (Pink/Magenta) -->
    <circle cx="332" cy="180" r="64" fill="url(#pinkGrad)"/>
    
    <!-- Bottom-Left: Circle (Gold) -->
    <circle cx="180" cy="332" r="64" fill="url(#goldGrad)"/>
    
    <!-- Bottom-Right: Square (Teal) -->
    <rect x="268" y="268" width="128" height="128" rx="16" fill="url(#tealGrad)"/>
  </g>
</svg>
