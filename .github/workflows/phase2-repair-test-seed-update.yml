name: Phase 2 Repair Test Seed Update

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search

permissions:
  contents: write

jobs:
  update-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update deterministic repair test seeds
        run: node scripts/apply-phase2-repair-test-seeds.mjs
      - name: Commit test seed updates
        run: |
          if git diff --quiet -- tests/music-engine.test.mjs tests/phrase-memory-intelligence.test.mjs; then
            echo "No test seed updates required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/music-engine.test.mjs tests/phrase-memory-intelligence.test.mjs
          git commit -m "Phase 2: use accepted repair reconciliation seed"
          git push origin HEAD:phase2/producer-brain-weakness-aware-search
