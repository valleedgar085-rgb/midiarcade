name: Bass Head Groove Director Census

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/bass-head-groove-census.mjs'
      - 'scripts/audit-bass-head-groove.mjs'
      - 'tests/bass-head-groove-census.test.mjs'
      - 'docs/bass-head-groove-phase-1.md'
      - '.github/workflows/bass-head-groove-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bass-head-census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test bass event analyzer and existing groove owners
        run: node --test tests/bass-head-groove-census.test.mjs tests/bass-continuity-refinement.test.mjs tests/groove-pocket-refinement.test.mjs
      - name: Measure kick/bass pockets in nine genres and two seeds
        run: node scripts/audit-bass-head-groove.mjs --seeds 2 --bars 32 --out "$RUNNER_TEMP/bass-head-report.json"
      - name: Upload full per-phrase diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-arcade-bass-head-groove-census
          path: ${{ runner.temp }}/bass-head-report.json
          if-no-files-found: warn
          retention-days: 14
