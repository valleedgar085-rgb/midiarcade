name: Phase 2 Dialogue Guard Codemod

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search
    paths:
      - .github/workflows/phase2-dialogue-guard-codemod.yml
      - scripts/apply-phase2-dialogue-guard.mjs
      - tests/producer-brain-repair-acceptance.test.mjs

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect baseline repair classes
        run: |
          node --input-type=module <<'NODE'
          import { generateNew } from './src/music-engine.js';
          const cases = [
            ['phase40-jazz', { seed: 'repair-reconcile-3', bars: 8, genre: 'jazz', energy: 0.05, complexity: 0.05 }],
            ['synthwave-dialogue', {
              genre: 'synthwave', seed: 'interlaced-phrase-proof', bars: 24,
              humanize: 0, swing: 0, tripletAmount: 0, rollAmount: 0,
              tracks: {
                melody: { density: 1, variation: 0.72, humanize: 0 },
                counterpoint: { density: 1, variation: 0.72, humanize: 0 },
              },
            }],
          ];
          for (const [name, input] of cases) {
            const song = generateNew(input);
            const details = song.meta?.scoreDetails ?? {};
            const selected = details.candidateScores?.find((row) => row.index === details.selectedCandidate);
            console.log('REPAIR_CLASS', JSON.stringify({
              name,
              selectedFromRepair: details.criticRepair?.selectedFromRepair,
              selectedGroup: details.criticRepair?.selectedGroup,
              selectedStrategy: selected?.repairStrategyId,
              selectedMode: selected?.repairMode,
              focusGroup: details.candidateSearch?.focusGroup,
              focusDimension: details.candidateSearch?.focusDimension,
              history: details.criticRepair?.acceptanceHistory,
            }));
          }
          NODE
      - name: Apply melodic dialogue acceptance guard
        run: node scripts/apply-phase2-dialogue-guard.mjs
      - name: Run repair and full music-engine regression tests
        run: node --test tests/producer-brain-repair-acceptance.test.mjs tests/producer-brain-specialized-repair.test.mjs tests/producer-brain-surgical-repair.test.mjs tests/music-engine.test.mjs
      - name: Measure repair effectiveness after dialogue guard
        run: npm run benchmark:repairs -- --seeds 2 --bars 8
      - name: Commit engine patch
        run: |
          if git diff --quiet -- src/music-engine.js; then
            echo "No engine changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/music-engine.js
          git commit -m "Phase 2: preserve melodic dialogue during repair"
          git push origin HEAD:phase2/producer-brain-weakness-aware-search
