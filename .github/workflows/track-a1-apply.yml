name: Track A1 Canonical Song Authority Patch

on:
  push:
    branches: ['track-a1/canonical-workspace-context']

permissions:
  contents: write

concurrency:
  group: track-a1-canonical-song-authority
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Track A1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tighten patch to preserve PreviewPlayer method contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-track-a1-authority-fix.mjs')
          s = p.read_text()
          s = s.replace(
              '''`  buildEvents(song = this.playbackSong ?? state.song) {\n    this.playbackSong = song;\n    this.events = buildPreviewEvents(song);\n    this.configureSongFx(song);\n    this.playbackView = playbackViewForSong(song);\n    this.lastDetailRefreshAt = -Infinity;\n  }`''',
              '''`  buildEvents() {\n    const song = this.playbackSong ?? state.song;\n    this.events = buildPreviewEvents(song);\n    this.configureSongFx(song);\n    this.playbackView = playbackViewForSong(song);\n    this.lastDetailRefreshAt = -Infinity;\n  }`''',
          )
          s = s.replace(
              '''`  async toggle() {\n    this.playing ? this.pause() : await this.play();\n  }\n\n  async auditionSong(song, { startSeconds = 0 } = {}) {\n    if (!song) return false;\n    this.stop();\n    this.position = clamp(Number(startSeconds) || 0, 0, totalSeconds(song));\n    return this.play(song);\n  }\n\n  async play(song = this.playbackSong ?? state.song) {\n    if (!song) return false;`''',
              '''`  async toggle() {\n    this.playing ? this.pause() : await this.play();\n  }\n\n  async auditionSong(song, { startSeconds = 0 } = {}) {\n    if (!song) return false;\n    this.stop();\n    this.playbackSong = song;\n    this.position = clamp(Number(startSeconds) || 0, 0, totalSeconds(song));\n    return this.play();\n  }\n\n  async play() {\n    const song = this.playbackSong ?? state.song;\n    if (!song) return false;`''',
          )
          s = s.replace(
              '''`    this.buildEvents(song);\n    const duration = totalSeconds(song);`''',
              '''`    this.buildEvents();\n    const duration = totalSeconds(song);`''',
          )
          s = s.replace(
              '''`  seek(position) {\n    const playbackSong = this.playbackSong ?? state.song;\n    const wasPlaying = this.playing;\n    this.pause();\n    this.position = clamp(position, 0, totalSeconds(playbackSong));\n    updatePlaybackUi(this.position, totalSeconds(playbackSong), {\n      view: this.playbackView ?? playbackViewForSong(playbackSong),\n    });\n    if (wasPlaying) this.play(playbackSong);\n  }\n\n  restart() {\n    const shouldPlay = this.playing;\n    const playbackSong = this.playbackSong ?? state.song;\n    this.stop();\n    if (shouldPlay) this.play(playbackSong);\n  }`''',
              '''`  seek(position) {\n    const playbackSong = this.playbackSong ?? state.song;\n    const wasPlaying = this.playing;\n    this.pause();\n    this.position = clamp(position, 0, totalSeconds(playbackSong));\n    updatePlaybackUi(this.position, totalSeconds(playbackSong), {\n      view: this.playbackView ?? playbackViewForSong(playbackSong),\n    });\n    if (wasPlaying) this.play();\n  }\n\n  restart() {\n    const shouldPlay = this.playing;\n    const playbackSong = this.playbackSong;\n    this.stop();\n    if (shouldPlay) {\n      this.playbackSong = playbackSong;\n      this.play();\n    }\n  }`''',
          )
          s = s.replace(
              'assert.match(playerClass, /buildEvents\\\\(song = this\\\\.playbackSong \\\\?\\\\? state\\\\.song\\\\)/);',
              'assert.match(playerClass, /buildEvents\\\\(\\\\) \\\\{[\\\\s\\\\S]*?const song = this\\\\.playbackSong \\\\?\\\\? state\\\\.song/);',
          )
          s = s.replace(
              'assert.match(playerClass, /async play\\\\(song = this\\\\.playbackSong \\\\?\\\\? state\\\\.song\\\\)/);',
              'assert.match(playerClass, /async play\\\\(\\\\) \\\\{[\\\\s\\\\S]*?const song = this\\\\.playbackSong \\\\?\\\\? state\\\\.song/);',
          )
          p.write_text(s)
          PY
          node --check scripts/apply-track-a1-authority-fix.mjs
      - name: Apply bounded Track A1 authority patch
        run: node scripts/apply-track-a1-authority-fix.mjs
      - name: Verify source syntax
        run: node --check src/app.js
      - name: Run focused authority regressions
        run: node --test tests/section-variation-authority.test.mjs tests/app-smoke.test.mjs tests/generation-timeout-ownership.test.mjs
      - name: Run mandatory repository quality gate
        run: npm run quality
      - name: Verify bounded source surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )
          printf '%s\n' "${changed[@]}"
          expected=$(printf '%s\n' scripts/apply-track-a1-authority-fix.mjs src/app.js tests/app-smoke.test.mjs tests/section-variation-authority.test.mjs | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
          git diff --check
      - name: Commit validated Track A1 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/track-a1-apply.yml scripts/apply-track-a1-authority-fix.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix section variation canonical song authority"
          git push origin HEAD:track-a1/canonical-workspace-context
