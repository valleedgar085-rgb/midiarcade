name: Apply Shape Director Transaction Safety

on:
  push:
    branches:
      - phase4/shape-director
    paths:
      - scripts/apply-shape-director-transaction-safety.mjs
      - .github/workflows/apply-shape-director-transaction-safety.yml

permissions:
  contents: write

jobs:
  guard-shape-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/shape-director
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply transaction safety patch
        run: node scripts/apply-shape-director-transaction-safety.mjs
      - name: Verify focused Shape safety contracts
        run: node --test tests/shape-director-policy.test.mjs tests/shape-director-engine.test.mjs tests/shape-director-ui-contract.test.mjs tests/shape-director-transaction-safety.test.mjs
      - name: Verify complete quality gate
        run: |
          npm run quality
          npm run quality:music
      - name: Commit verified transaction safety
        run: |
          if git diff --quiet -- src/app.js tests/shape-director-transaction-safety.test.mjs; then
            echo "No Shape Director transaction-safety changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js tests/shape-director-transaction-safety.test.mjs
          git commit -m "Protect Shape Director preview transactions"
          git push origin HEAD:phase4/shape-director
