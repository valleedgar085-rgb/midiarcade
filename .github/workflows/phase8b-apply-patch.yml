name: Apply Phase 8B transition separation

on:
  push:
    branches:
      - phase8/arrangement-recontextualization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8/arrangement-recontextualization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Phase 8B patch
        run: node scripts/phase8b-separate-transition-performance.mjs
      - name: Verify arrangement and fusion contracts
        run: >-
          node --test
          tests/arrangement-recontextualization.test.mjs
          tests/arrangement-evolution.test.mjs
          tests/arrangement-candidate-search.test.mjs
          tests/arrangement-narrative-ranking.test.mjs
          tests/fusion-repetition-refinement.test.mjs
          tests/fusion-pop-hiphop-rap-calibration.test.mjs
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/arrangement-evolution.js tests/arrangement-recontextualization.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep arrangement recontextualization atomic"
          git push origin HEAD:phase8/arrangement-recontextualization
