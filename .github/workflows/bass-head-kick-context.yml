name: Bass Head Kick-Relative Context Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/bass-head-timing-context.mjs'
      - 'scripts/audit-bass-head-kick-context.mjs'
      - 'tests/bass-head-timing-context.test.mjs'
      - 'docs/bass-head-context-phase-4.md'
      - '.github/workflows/bass-head-kick-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify kick-relationship interpretation and existing protected bass behavior
        run: node --test tests/bass-head-timing-context.test.mjs tests/bass-head-bounce-shadow.test.mjs tests/bass-head-preference-selector.test.mjs tests/bass-head-groove-census.test.mjs
      - name: Read-only context audit of three independent Neo-Soul song seeds
        run: node scripts/audit-bass-head-kick-context.mjs --indices 4,7,8 --json "$RUNNER_TEMP/bass-head-context.json"
      - name: Upload context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-arcade-bass-head-kick-context
          path: ${{ runner.temp }}/bass-head-context.json
          if-no-files-found: error
          retention-days: 14
