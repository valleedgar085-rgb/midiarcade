name: Apply EPS Runtime Wiring

on:
  push:
    branches:
      - phase3/producer-brain-observability-loop
    paths:
      - scripts/apply-eps-runtime-wiring-v2.mjs
      - scripts/apply-eps-runtime-test-contract.mjs
      - .github/workflows/apply-eps-runtime-wiring.yml

permissions:
  contents: write

jobs:
  wire-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[eps-runtime-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/producer-brain-observability-loop
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply asserted EPS runtime patch v2
        run: node scripts/apply-eps-runtime-wiring-v2.mjs

      - name: Update EPS runtime smoke contract
        run: node scripts/apply-eps-runtime-test-contract.mjs

      - name: Verify elemental program policy
        run: node --test tests/elemental-program-policy.test.mjs tests/producer-variation-set.test.mjs tests/auto-control-policy.test.mjs

      - name: Verify complete quality gate
        run: |
          set +e
          npm run quality > eps-quality.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path('eps-quality.log').read_text(errors='replace').splitlines()
          needles = ('not ok ', 'failureType:', 'AssertionError', 'ERR_ASSERTION', 'ERR_TEST_FAILURE', 'actual:', 'expected:')
          hits = [index for index, line in enumerate(lines) if any(needle in line for needle in needles)]
          selected = set()
          for hit in hits:
              selected.update(range(max(0, hit - 30), min(len(lines), hit + 90)))
          selected.update(range(max(0, len(lines) - 45), len(lines)))
          output = []
          previous = None
          for index in sorted(selected):
              if previous is not None and index > previous + 1:
                  output.append('--- omitted ---')
              output.append(f'{index + 1}: {lines[index]}')
              previous = index
          Path('eps-quality-failure.txt').write_text('\n'.join(output) + '\n')
          PY
            exit "$status"
          fi

      - name: Persist quality diagnostics
        if: failure() && hashFiles('eps-quality-failure.txt') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eps-quality-failure.txt
          git commit -m "Capture precise EPS quality failure [eps-diagnostics]"
          git push origin HEAD:phase3/producer-brain-observability-loop

      - name: Commit verified runtime wiring
        if: success()
        run: |
          if git diff --quiet -- src/app.js index.html tests/app-smoke.test.mjs; then
            echo "Expected runtime wiring changes were not produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js index.html tests/app-smoke.test.mjs
          git commit -m "Wire elemental program authority and variation UI [eps-runtime-wired]"
          git push origin HEAD:phase3/producer-brain-observability-loop
