name: UIUX Phase 1 Create

on:
  push:
    branches:
      - uiux/phase1-create-workflow
    paths:
      - src/ui/create-workflow.css
      - scripts/build.js
      - tests/uiux-create-workflow.test.mjs
      - .github/workflows/uiux-phase1-create.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out UI branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Create UI regressions
        run: node --test tests/uiux-create-workflow.test.mjs tests/app-smoke.test.mjs
      - name: Run web build quality gate
        run: npm run quality
