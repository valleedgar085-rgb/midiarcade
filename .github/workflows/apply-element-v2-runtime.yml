name: Apply Element V2 Runtime

on:
  push:
    branches:
      - phase3/producer-brain-observability-loop
    paths:
      - scripts/apply-element-v2-runtime.mjs
      - .github/workflows/apply-element-v2-runtime.yml

permissions:
  contents: write

jobs:
  wire-element-v2:
    if: ${{ !contains(github.event.head_commit.message, '[element-v2-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/producer-brain-observability-loop
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Element V2 runtime patch
        run: node scripts/apply-element-v2-runtime.mjs

      - name: Verify Element V2 contracts
        run: node --test tests/elemental-program-policy.test.mjs tests/elemental-sound-profile.test.mjs tests/elemental-runtime-authority.test.mjs tests/producer-variation-set.test.mjs

      - name: Verify complete quality gate
        run: npm run quality

      - name: Commit verified Element V2 runtime
        run: |
          if git diff --quiet -- src/app.js src/core/producer-variation-set.js src/ui/create-workflow.css; then
            echo "Expected Element V2 runtime changes were not produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/core/producer-variation-set.js src/ui/create-workflow.css
          git commit -m "Make elemental playback and identity visibly distinct [element-v2-wired]"
          git push origin HEAD:phase3/producer-brain-observability-loop
