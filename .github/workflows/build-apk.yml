name: Build AutoCircuit Atlas Lab APK
on:
  workflow_dispatch:
  push:
    branches: [build/autocircuit-atlas-v0.3.9-apk]
permissions:
  contents: read
jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated Atlas source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify PID decoder
        shell: bash
        run: |
          mkdir -p tests/out
          javac -d tests/out app/src/main/java/com/autocircuit/atlas/ObdPidDecoder.java tests/ObdPidDecoderTest.java
          java -cp tests/out ObdPidDecoderTest
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCircuitAtlasLab-0.3.9-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
