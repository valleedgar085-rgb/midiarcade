name: Diagnose Phase 9D Return Candidates

on:
  push:
    branches:
      - phase9d/return-development-genome

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9d/return-development-genome
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose exact 63-song return candidate matrix
        run: node scripts/diagnose-phase9d-return.mjs
      - name: Remove temporary diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982c+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-phase9d-return.yml scripts/diagnose-phase9d-return.mjs
          git commit -m "Remove temporary Phase 9D diagnostics"
          git push origin HEAD:phase9d/return-development-genome
