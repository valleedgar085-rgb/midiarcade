name: Phase 9E startup-budget fix

on:
  push:
    branches:
      - phase9e/creative-range-ui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 9E branch
        uses: actions/checkout@v4
        with:
          ref: phase9e/creative-range-ui
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply runtime-mount budget fix
        run: python scripts/phase9e-runtime-mount.py

      - name: Install dependencies
        run: npm ci

      - name: Verify focused Phase 9E contracts
        run: node --test tests/creative-range-policy.test.mjs tests/creative-range-ui.test.mjs tests/creative-range-neutrality.test.mjs tests/create-control-contract.test.mjs tests/app-smoke.test.mjs

      - name: Run repository web quality gate
        run: npm run quality

      - name: Run music quality gate
        run: npm run quality:music

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit budget-safe Phase 9E implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase9e-budget-fix.yml scripts/phase9e-runtime-mount.py
          git add index.html src/ui/create-workflow-phase1.js tests/creative-range-ui.test.mjs tests/create-control-contract.test.mjs tests/app-smoke.test.mjs docs/phase9e-creative-range.md
          git commit -m "Phase 9E: preserve startup budget with pre-wiring mount"
          git push origin HEAD:phase9e/creative-range-ui
