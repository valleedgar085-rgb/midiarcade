name: Read-only Musical Weakness Census

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-musical-weaknesses.mjs'
      - '.github/workflows/musical-weakness-census.yml'
      - 'docs/musical-weakness-census.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Census all genres and both deterministic seed cases
        run: node scripts/audit-musical-weaknesses.mjs --seeds 2 --bars 32 --json "$RUNNER_TEMP/musical-weakness-census.json"
      - name: Upload complete per-seed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-arcade-musical-weakness-census
          path: ${{ runner.temp }}/musical-weakness-census.json
          if-no-files-found: warn
          retention-days: 14
