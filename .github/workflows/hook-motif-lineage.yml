name: Hook Motif Lineage Census

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-hook-lineage.mjs'
      - 'scripts/lib/hook-lineage-audit.mjs'
      - 'scripts/lib/hook-note-evidence.mjs'
      - 'tests/hook-lineage-audit.test.mjs'
      - 'tests/hook-note-evidence.test.mjs'
      - '.github/workflows/hook-motif-lineage.yml'
      - 'docs/hook-motif-lineage.md'
      - 'docs/hook-return-note-evidence-plan-20261017.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage-census:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/hook-lineage-audit.test.mjs tests/hook-note-evidence.test.mjs tests/genre-aware-hook-return-v2.test.mjs
      - name: Run read-only all-genre 32-bar hook source lineage census
        run: node scripts/audit-hook-lineage.mjs --seeds 2 --bars 32 --out "$RUNNER_TEMP/hook-lineage.json"
      - name: Verify ensemble coordination and MIDI projection parity
        run: |
          npm run quality:ensemble
          node --test tests/midi-export-parity.test.mjs
      - name: Upload lineage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-arcade-hook-lineage-audit
          path: ${{ runner.temp }}/hook-lineage.json
          retention-days: 14
          if-no-files-found: warn
