name: Apply Shape Director UI

on:
  push:
    branches:
      - phase4/shape-director
    paths:
      - scripts/apply-shape-director-ui.mjs
      - scripts/fix-shape-director-ui-harness.mjs
      - scripts/patch-shape-director-static-wiring.mjs
      - .github/workflows/apply-shape-director-ui.yml

permissions:
  contents: write

jobs:
  wire-shape-director:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: phase4/shape-director
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair temporary UI harness
        run: node scripts/fix-shape-director-ui-harness.mjs
      - name: Apply Shape Director UI patch
        run: node scripts/apply-shape-director-ui.mjs
      - name: Extend static delegated-button guard
        run: node scripts/patch-shape-director-static-wiring.mjs
      - name: Verify focused Shape Director contracts
        run: node --test tests/shape-director-policy.test.mjs tests/shape-director-engine.test.mjs tests/shape-director-ui-contract.test.mjs
      - name: Verify complete quality gate
        run: |
          npm run quality
          npm run quality:music
      - name: Commit verified Shape Director UI
        run: |
          if git diff --quiet -- src/app.js index.html styles.css tests/shape-director-ui-contract.test.mjs tests/app-smoke.test.mjs; then
            echo "No Shape Director UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js index.html styles.css tests/shape-director-ui-contract.test.mjs tests/app-smoke.test.mjs
          git commit -m "Wire Shape Director candidate workflow"
          git push origin HEAD:phase4/shape-director
