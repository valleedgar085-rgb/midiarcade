name: Phase 2 Checkpoint 6 Codemod

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search
    paths:
      - scripts/apply-phase2-checkpoint6.mjs
      - scripts/fix-phase2-checkpoint6-contract.mjs
      - scripts/fix-phase2-checkpoint6-harmony.mjs
      - .github/workflows/phase2-checkpoint6-codemod.yml

permissions:
  contents: write

jobs:
  patch-test-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply checkpoint 6 patch
        run: |
          node scripts/apply-phase2-checkpoint6.mjs
          node scripts/fix-phase2-checkpoint6-contract.mjs
          node scripts/fix-phase2-checkpoint6-harmony.mjs
      - name: Run focused Producer Brain tests
        run: node --test tests/producer-brain-specialized-repair.test.mjs tests/producer-brain-repair-acceptance.test.mjs tests/producer-brain-surgical-repair.test.mjs tests/music-engine.test.mjs tests/phrase-memory-intelligence.test.mjs
      - name: Benchmark repair effectiveness
        run: npm run benchmark:repairs -- --seeds 2 --bars 8
      - name: Commit validated checkpoint 6 repair
        run: |
          if git diff --quiet -- src/music-engine.js; then
            echo "No validated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/music-engine.js
          git commit -m "Phase 2: restore harmony fallback with surgical voicing"
          git push origin HEAD:phase2/producer-brain-weakness-aware-search
