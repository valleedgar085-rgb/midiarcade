name: Phase 2 Repair Seed Diagnostic

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan deterministic repair seeds
        run: node scripts/find-accepted-repair-seeds.mjs
