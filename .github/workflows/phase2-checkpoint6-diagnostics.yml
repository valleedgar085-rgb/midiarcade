name: Phase 2 Checkpoint 6 Diagnostics

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search
    paths:
      - scripts/diagnose-phase2-checkpoint6.mjs
      - .github/workflows/phase2-checkpoint6-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checkpoint 6 diagnostics
        run: node scripts/diagnose-phase2-checkpoint6.mjs
