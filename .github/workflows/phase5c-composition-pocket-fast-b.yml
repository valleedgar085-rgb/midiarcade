name: Phase 5C Composition Pocket Fast Gate B

on:
  push:
    branches: [validate-composition-pocket-lock-5c-fast-b]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-pocket-fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify composition pocket authority
        run: >
          node --test
          tests/composition-pocket-lock.test.mjs
          tests/composition-candidate-judge.test.mjs
          tests/groove-authority-lock.test.mjs
          tests/groove-dna-authority-regression.test.mjs
          tests/musical-timing-lock.test.mjs
          tests/musical-timing-repair.test.mjs
          tests/android-release-contract.test.mjs
          tests/music-engine.test.mjs
      - name: Verify production web build
        run: npm run build
