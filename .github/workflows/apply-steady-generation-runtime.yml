name: Apply steady generation runtime

on:
  push:
    branches:
      - phase3/producer-brain-observability-loop
    paths:
      - scripts/apply-steady-generation-runtime.mjs
      - .github/workflows/apply-steady-generation-runtime.yml

permissions:
  contents: write

jobs:
  wire-steady-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase3/producer-brain-observability-loop
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply steady generation runtime patch
        run: node scripts/apply-steady-generation-runtime.mjs
      - name: Verify steady generation contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { generationMinimumVisibleMs, generationStageState } from './src/ui/generation-progress.js';
          const app = fs.readFileSync('./src/app.js', 'utf8');
          const smoke = fs.readFileSync('./tests/app-smoke.test.mjs', 'utf8');
          assert.match(app, /generationDelay\(kind = "new"\)/);
          assert.match(app, /generationMinimumVisibleMs\(kind\)/);
          assert.match(app, /generationDelay\(kind\)/);
          assert.match(app, /Date\.now\(\) - startedAt\), 160\)/);
          assert.match(smoke, /waitForGenerationCommit\(app, previousGenerationCount, timeoutMs = 12000\)/);
          assert.match(smoke, /!snapshot\.isGenerating && snapshot\.generationCount > previousGenerationCount/);
          assert.doesNotMatch(smoke, /setTimeout\(resolve,\s*(?:520|560)\)/);
          assert.ok(generationMinimumVisibleMs('new') >= 3000);
          assert.ok(generationMinimumVisibleMs('songVariations') >= 4000);
          const early = generationStageState('new', 200);
          const later = generationStageState('new', 1800);
          assert.ok(later.progress > early.progress);
          assert.ok(later.progress < 1);
          NODE
      - name: Verify complete quality gate
        run: |
          npm run quality
          npm run quality:music
      - name: Commit verified runtime wiring
        run: |
          if git diff --quiet -- src/app.js tests/app-smoke.test.mjs; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js tests/app-smoke.test.mjs
          git commit -m "Steady Producer Brain loading runtime"
          git push origin HEAD:phase3/producer-brain-observability-loop
