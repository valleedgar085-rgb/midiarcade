name: Apply Preview Runtime Patch

on:
  push:
    branches:
      - phase7/web-audio-arrangement-quality
    paths:
      - .github/workflows/patch-preview-runtime.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase7/web-audio-arrangement-quality
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic runtime patch
        run: node scripts/patch-preview-runtime.mjs

      - name: Verify audio continuity contracts
        run: node --test tests/preview-audio-transition.test.mjs tests/preview-loop-continuity-contract.test.mjs

      - name: Commit runtime patch
        run: |
          if git diff --quiet -- src/app.js; then
            echo "Runtime patch produced no app.js diff" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git commit -m "Wire click-safe PreviewPlayer loop transitions"
          git push origin HEAD:phase7/web-audio-arrangement-quality
