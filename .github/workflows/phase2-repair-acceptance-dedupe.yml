name: Phase 2 Repair Acceptance Dedupe

on:
  push:
    branches:
      - phase2/producer-brain-weakness-aware-search

permissions:
  contents: write

jobs:
  dedupe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase2/producer-brain-weakness-aware-search
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicate acceptance declarations
        run: node scripts/dedupe-repair-acceptance.mjs
      - name: Commit deduplicated engine
        run: |
          if git diff --quiet -- src/music-engine.js; then
            echo "No engine dedupe required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/music-engine.js
          git commit -m "Phase 2: deduplicate repair acceptance evaluator"
          git push origin HEAD:phase2/producer-brain-weakness-aware-search
