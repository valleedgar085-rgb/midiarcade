name: UI UX Phase 1 Create

on:
  push:
    branches:
      - uiux/phase1-create-workflow
    paths:
      - scripts/apply-uiux-phase1-create.mjs
      - .github/workflows/uiux-phase1-create.yml

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: uiux/phase1-create-workflow
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Create hierarchy
        run: node scripts/apply-uiux-phase1-create.mjs
      - name: Run UI smoke and quality gates
        run: |
          node --test tests/app-smoke.test.mjs
          npm run quality
      - name: Commit validated UI changes
        run: |
          if git diff --quiet -- styles.css; then
            echo "No UI changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "UI/UX Phase 1: clarify Create workflow hierarchy"
          git push origin HEAD:uiux/phase1-create-workflow
